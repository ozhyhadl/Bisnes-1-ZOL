<svg width="768" height="768" viewBox="0 0 768 768" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">n8n Integration Automation Bundle poster</title>
  <desc id="desc">Promotional artwork for 1,800 plus ready-made n8n workflows.</desc>
  <defs>
